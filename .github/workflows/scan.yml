# Daily portfolio + market refresh.
#
# Order matters: the BankSync push (Claude routine, ~05:00 SGT) must land first, so this
# workflow WAITS for the routine's completion marker in Supabase, then settles 10 minutes,
# then runs the portfolio steps, and only afterwards the 3-hour market scan.
name: PAM daily refresh

on:
  schedule:
    # 21:30 UTC = 05:30 SGT next morning, 30 min after the 05:00 SGT BankSync sheet refresh.
    # Sun-Thu in UTC == Mon-Fri in Singapore.
    - cron: '30 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- 1. BankSync sheet -> bank_fills ----------
      - name: Pull BankSync transactions
        continue-on-error: true
        env:
          BANKSYNC_URL: ${{ secrets.BANKSYNC_URL }}
          BANKSYNC_TOKEN: ${{ secrets.BANKSYNC_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          BANKSYNC_DAYS: '120'
        run: node pam_daily.js banksync

      # ---------- 2. mark every open leg ----------
      - name: Mark open option legs
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MD_TOKEN: ${{ secrets.MD_TOKEN }}
          MD_MAX_CREDITS: '90'
        run: node pam_daily.js mark

      # ---------- 3. whole-market scan (slowest, runs last) ----------
      - name: Run the market scan
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          PAM_HTML: pam_analyzer.html
          PAM_LIMIT: '0'
          PAM_OPT_MIN_MC: '2000000000'
        run: |
          # By the time the fills+marks steps finish we are well past 16:25 New York, so this
          # loop normally passes immediately. It stays as a guard for manual runs.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            while :; do
              ET=$(TZ=America/New_York date +%H%M)
              [ "$((10#$ET))" -ge 1625 ] && break
              echo "Market still open - waiting (now $(TZ=America/New_York date '+%H:%M') New York)..."
              sleep 120
            done
          fi
          echo "Running scan at $(TZ=America/New_York date '+%H:%M') New York"
          node pam_scan.js

      - name: Publish scan_results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_results.json 2>/dev/null || true
          git add iv_history.json 2>/dev/null || true
          git add enrichment_cache.json 2>/dev/null || true
          git add earnings.json 2>/dev/null || true
          git add earnings_backfill.json 2>/dev/null || true
          git commit -m "market scan $(date -u +%Y-%m-%d) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed - refreshing latest main and retrying..."
            sleep 5
          done
          echo "could not push results after 5 attempts"; exit 1
